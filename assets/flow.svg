<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 168" width="880" height="168" role="img" aria-label="Double-click AFKLocker, Windows locks, close the lid, apps and services keep running">
  <title>The AFKLocker flow</title>
  <style>
    .box   { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .label { fill: #24292f; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sub   { fill: #656d76; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ink   { fill: none; stroke: #24292f; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ink-f { fill: #24292f; }
    .accent{ fill: #0f6cbd; }
    .arrow { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .box   { stroke: #30363d; }
      .label { fill: #e6edf3; }
      .sub   { fill: #8b949e; }
      .ink   { stroke: #e6edf3; }
      .ink-f { fill: #e6edf3; }
      .accent{ fill: #4493f8; }
      .arrow { stroke: #6e7781; }
    }
  </style>

  <!-- 1. Double-click AFKLocker -->
  <g transform="translate(0,14)">
    <rect class="box" x="1" y="1" width="190" height="118" rx="10"/>
    <g transform="translate(78,24)">
      <rect class="accent" x="4" y="14" width="28" height="15" rx="3"/>
      <path class="ink" d="M 10,14 v -4 a 8,8 0 0 1 16,0 v 4"/>
      <path class="ink-f" d="M 24,31 l 12,10 -5,1 3,6 -3,1.5 -3,-6 -4,3 z"/>
    </g>
    <text class="label" x="96" y="92" text-anchor="middle">Double-click</text>
    <text class="sub"   x="96" y="108" text-anchor="middle">AFKLocker</text>
  </g>

  <path class="arrow" d="M 202,73 h 26 m -6,-5 l 6,5 -6,5"/>

  <!-- 2. Windows locks -->
  <g transform="translate(230,14)">
    <rect class="box" x="1" y="1" width="190" height="118" rx="10"/>
    <g transform="translate(78,24)">
      <path class="ink" d="M 10,18 v -5 a 8,8 0 0 1 16,0 v 5"/>
      <rect class="accent" x="4" y="18" width="28" height="20" rx="3.5"/>
    </g>
    <text class="label" x="96" y="92" text-anchor="middle">Windows locks</text>
    <text class="sub"   x="96" y="108" text-anchor="middle">instantly</text>
  </g>

  <path class="arrow" d="M 432,73 h 26 m -6,-5 l 6,5 -6,5"/>

  <!-- 3. Close the lid -->
  <g transform="translate(460,14)">
    <rect class="box" x="1" y="1" width="190" height="118" rx="10"/>
    <g transform="translate(74,26)">
      <path class="ink" d="M 6,34 h 36"/>
      <path class="ink" d="M 10,30 l 12,-18 a 2,2 0 0 1 3,-0.4 l 12,18"/>
      <path class="arrow" d="M 30,6 a 12,12 0 0 1 8,8 m 0,0 l -5,-1 m 5,1 l 1,-5"/>
    </g>
    <text class="label" x="96" y="92" text-anchor="middle">Close the lid</text>
    <text class="sub"   x="96" y="108" text-anchor="middle">screen goes dark</text>
  </g>

  <path class="arrow" d="M 662,73 h 26 m -6,-5 l 6,5 -6,5"/>

  <!-- 4. Everything keeps running -->
  <g transform="translate(690,14)">
    <rect class="box" x="1" y="1" width="190" height="118" rx="10"/>
    <g transform="translate(72,28)">
      <path class="ink" d="M 2,16 h 8 l 5,-11 6,22 5,-14 4,7 h 12"/>
      <circle class="accent" cx="44" cy="20" r="4"/>
    </g>
    <text class="label" x="96" y="92" text-anchor="middle">Everything keeps</text>
    <text class="sub"   x="96" y="108" text-anchor="middle">running</text>
  </g>
</svg>
