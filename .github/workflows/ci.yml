# CI profile: public
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Read-only by default. Any job needing more asks for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safety:
    name: Safety
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout safety policy from the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-policy
          sparse-checkout: .github/scripts
          persist-credentials: false

      # One-time bootstrap: this migration's base has no safety.sh yet.
      # Only then use the PR copy; subsequent PRs always execute the base copy.
      - name: Bootstrap safety policy from the PR
        if: hashFiles('base-policy/.github/scripts/safety.sh') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: bootstrap-policy
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Checkout PR history for secret scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Check secrets and critical effects
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
          PR_DIR: ${{ github.workspace }}/pr
        run: |
          if [ -f base-policy/.github/scripts/safety.sh ]; then
            bash base-policy/.github/scripts/safety.sh
          else
            echo 'One-time bootstrap: safety.sh is absent from the base; running the PR copy.'
            bash bootstrap-policy/.github/scripts/safety.sh
          fi

  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      # Third-party actions are pinned to an immutable commit SHA, not a tag.
      # A tag can be moved to point at different code; a SHA cannot.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      # The version lives in three files. Bumping two of the three is an
      # ordinary slip and produces an installer whose file name, Programs and
      # Features entry and About text disagree, so it is checked rather than
      # remembered.
      - name: Check versions agree
        shell: pwsh
        run: ./tools/Check-Version.ps1

      # Regenerating the icon from its vector definition must produce exactly
      # what is committed, otherwise the assets in the repo are not reproducible.
      - name: Verify icon assets are reproducible
        shell: pwsh
        run: |
          ./tools/Build-Icon.ps1
          $changed = git status --porcelain assets
          if ($changed) {
            Write-Host "Icon assets differ from their committed versions:"
            Write-Host $changed
            exit 1
          }
          Write-Host "Icon assets match their vector source."

      # Build once: the installer packages the same binaries the tests use.
      # The native compiler needs no SDK installation or dependency restore.
      # No signing secrets are needed because CI publishes no release.
      - name: Build, run tests and build installer
        shell: pwsh
        run: ./tools/Build.ps1 -Test -Installer -Iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: afklocker-build
          path: |
            build/AFKLocker.exe
            build/AFKLockerSetup.exe
            build/AFKLockerWatcher.exe
            build/AFKLocker.Core.dll
            build/AFKLocker-*-setup.exe
          if-no-files-found: error

  ci-passed:
    name: CI passed
    needs: [safety, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every job to succeed
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $jobs = ConvertFrom-Json $env:NEEDS_JSON
          foreach ($job in $jobs.PSObject.Properties) {
            if ($job.Value.result -eq 'success') { continue }
            if ($job.Name -eq 'safety' -and $job.Value.result -eq 'skipped' -and $env:EVENT_NAME -eq 'push') { continue }
            throw "Required job $($job.Name): $($job.Value.result)"
          }
