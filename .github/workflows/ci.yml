name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Any job needing more asks for it explicitly.
permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      # Third-party actions are pinned to an immutable commit SHA, not a tag.
      # A tag can be moved to point at different code; a SHA cannot.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      # The version lives in three files. Bumping two of the three is an
      # ordinary slip and produces an installer whose file name, Programs and
      # Features entry and About text disagree, so it is checked rather than
      # remembered.
      - name: Check versions agree
        shell: pwsh
        run: ./tools/Check-Version.ps1

      # No signing in CI: nothing is published from here, so the signing
      # secrets are not needed and are therefore not exposed.
      - name: Build and run tests
        shell: pwsh
        run: ./tools/Build.ps1 -Test

      # Regenerating the icon from its vector definition must produce exactly
      # what is committed, otherwise the assets in the repo are not reproducible.
      - name: Verify icon assets are reproducible
        shell: pwsh
        run: |
          ./tools/Build-Icon.ps1
          $changed = git status --porcelain assets
          if ($changed) {
            Write-Host "Icon assets differ from their committed versions:"
            Write-Host $changed
            exit 1
          }
          Write-Host "Icon assets match their vector source."

      - name: Build installer
        shell: pwsh
        run: ./tools/Build.ps1 -Installer -Iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: afklocker-build
          path: |
            build/AFKLocker.exe
            build/AFKLockerSetup.exe
            build/AFKLockerWatcher.exe
            build/AFKLocker.Core.dll
            build/AFKLocker-*-setup.exe
          if-no-files-found: error
